[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ridgepoint"
version = "0.1.0"
description = "LLM inference sizing that models the engine, not just the weights: engine-aware VRAM capacity, KV cache (GQA/MLA), and roofline intervals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Iskariot" }]
keywords = ["llm", "inference", "vram", "kv-cache", "roofline", "gpu", "sizing", "vllm"]

[project.urls]
Homepage = "https://github.com/Isk4R1oT/ridgepoint"
Repository = "https://github.com/Isk4R1oT/ridgepoint"

[tool.maturin]
# Enable the PyO3 extension for wheel builds; the CLI/core stay dep-free otherwise.
features = ["python"]
